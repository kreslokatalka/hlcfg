# A cozy dark Kitty theme with the desktop's pink + sky-blue accents.

# Typography
font_family Hack
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# Deep plum-slate background with soft, readable text.
foreground           #e8e5ed
background           #171923
selection_foreground #171923
selection_background #bdeeff
url_color            #70cfff
cursor               #f7a8b8
cursor_text_color    #171923

# Dark ANSI palette with gentle rose, lavender, and sky-blue highlights.
color0  #292b38
color8  #777b8d
color1  #d87991
color9  #f7a8b8
color2  #83a991
color10 #a6c9ad
color3  #d1a66f
color11 #edc58e
color4  #5799c1
color12 #55cdfc
color5  #b48ead
color13 #d3a6cb
color6  #5799a8
color14 #83c8d8
color7  #d5d2dc
color15 #f7f5fa

# Translucent background and soft accent borders.
window_padding_width 10
background_opacity 0.82
active_border_color   #55cdfc
inactive_border_color #41404e
window_border_width   1.5pt

# Rounded, unobtrusive tabs.
tab_bar_style       powerline
tab_powerline_style round
active_tab_foreground #171923
active_tab_background #bdeeff
inactive_tab_foreground #b2adbd
inactive_tab_background #292633
tab_bar_background #171923

# Small quality-of-life settings.
cursor_shape block
cursor_blink_interval 0
enable_audio_bell no
mouse_hide_wait 3.0
scrollback_lines 10000
copy_on_select clipboard

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Current desktop palette, managed by the theme gallery.
include /home/kreslo/.config/kitty/theme-gallery-include.conf