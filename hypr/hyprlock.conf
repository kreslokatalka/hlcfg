# hyprlock configuration
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /home/kreslo/.config/hypr/images/2.png
    blur_passes = 3
    blur_size = 8
    color = rgba(247, 248, 252, 1.0)
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(85, 205, 252, 1.0)
    inner_color = rgba(255, 255, 255, 0.96)
    font_color = rgba(37, 45, 58, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    hide_input = false
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(37, 45, 58, 1.0)
    font_size = 88
    font_family = sans-serif
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%d.%m.%Y')"
    color = rgba(190, 91, 122, 1.0)
    font_size = 22
    font_family = sans-serif
    position = 0, 78
    halign = center
    valign = center
}
